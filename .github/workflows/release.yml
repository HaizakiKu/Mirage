name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64  }
          - { goos: linux,   goarch: arm64  }
          - { goos: linux,   goarch: arm,   goarm: "7" }
          - { goos: darwin,  goarch: amd64  }
          - { goos: darwin,  goarch: arm64  }
          - { goos: windows, goarch: amd64  }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM:  ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          SUFFIX=""
          [[ "${{ matrix.goos }}" == "windows" ]] && SUFFIX=".exe"
          NAME="mirage-${{ matrix.goos }}-${{ matrix.goarch }}"
          [[ -n "${{ matrix.goarm }}" ]] && NAME="${NAME}v${{ matrix.goarm }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/${NAME}${SUFFIX}" ./cmd/mirage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirage-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*
          retention-days: 1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
